<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Add Movie</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .play-logo {
        filter: brightness(0) saturate(100%) invert(79%) sepia(96%)
          saturate(1842%) hue-rotate(359deg) brightness(101%) contrast(104%);
      }
    </style>
  </head>

  <body class="min-h-screen bg-[#0b2468] p-5 md:p-10">
    <form id="movie-form" class="mx-auto max-w-5xl">
      <div class="space-y-12">
        <div class="border-b border-white/10 pb-12">
          <!-- HEADER -->
          <div class="flex items-center gap-3">
            <img
              src="image/play 1.svg"
              alt="Play"
              class="play-logo h-10 w-10"
            />

            <div>
              <h2 class="text-xl font-semibold text-white">
                Add / Update Movie
              </h2>

              <p class="text-sm font-semibold text-white">
                Fill the movie details below.
              </p>
            </div>
          </div>

          <!-- FORM CONTENT -->
          <div class="mt-10 grid grid-cols-1 gap-8 md:grid-cols-2">
            <!-- BAGIAN KIRI -->
            <div class="space-y-5">
              <!-- TITLE -->
              <div>
                <label
                  for="title"
                  class="block text-sm font-medium text-white"
                >
                  Title <span class="text-red-500">*</span>
                </label>

                <div class="mt-2">
                  <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="Enter movie title"
                    required
                    class="block w-full rounded-md bg-white/10 px-3 py-2 text-sm text-white outline-1 outline-white/10 placeholder:text-gray-400 focus:outline-2 focus:outline-yellow-400"
                  />
                </div>
              </div>

              <!-- POPULARITY -->
              <div>
                <label
                  for="popularity"
                  class="block text-sm font-medium text-white"
                >
                  Popularity <span class="text-red-500">*</span>
                </label>

                <div class="mt-2">
                  <input
                    id="popularity"
                    type="number"
                    name="popularity"
                    min="0"
                    max="5"
                    step="0.1"
                    placeholder="Enter rating (0.0–5.0)"
                    required
                    class="block w-full rounded-md bg-white/10 px-3 py-2 text-sm text-white outline-1 outline-white/10 placeholder:text-gray-400 focus:outline-2 focus:outline-yellow-400"
                  />
                </div>
              </div>

              <!-- OVERVIEW -->
              <div>
                <label
                  for="overview"
                  class="block text-sm font-medium text-white"
                >
                  Overview <span class="text-red-500">*</span>
                </label>

                <div class="relative mt-2">
                  <textarea
                    id="overview"
                    name="overview"
                    rows="6"
                    maxlength="500"
                    placeholder="Enter movie overview..."
                    required
                    class="block min-h-40 w-full resize-none rounded-md bg-white/10 px-3 py-2 pb-7 text-sm text-white outline-1 outline-white/10 placeholder:text-gray-400 focus:outline-2 focus:outline-yellow-400"
                  ></textarea>

                  <p
                    id="character-count"
                    class="absolute bottom-2 right-3 text-xs text-gray-400"
                  >
                    0/500
                  </p>
                </div>
              </div>
            </div>

            <!-- BAGIAN KANAN -->
            <div>
              <label
                for="file-upload"
                class="block text-sm font-medium text-white"
              >
                Image <span class="text-red-500">*</span>
              </label>

              <!-- AREA UPLOAD -->
              <label
                for="file-upload"
                class="mt-2 flex min-h-64 cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-white/30 px-6 py-10 hover:border-yellow-400"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                  class="h-12 w-12 text-white"
                >
                  <path
                    d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z"
                    clip-rule="evenodd"
                    fill-rule="evenodd"
                  />
                </svg>

                <p
                  id="upload-text"
                  class="mt-5 text-center text-sm font-semibold text-gray-300"
                >
                  Drag and drop image here
                </p>

                <p class="mt-2 text-xs text-gray-400">
                  or click to upload a file
                </p>

                <input
                  id="file-upload"
                  type="file"
                  name="image"
                  accept=".png,.jpg,.jpeg,.webp"
                  required
                  class="sr-only"
                />
              </label>

              <p class="mt-1 text-xs text-gray-400">
                Supported formats: JPG, PNG, WEBP (max. 5MB)
              </p>
            </div>
          </div>

          <!-- BUTTONS -->
          <div class="mt-6 flex items-center justify-end gap-3">
            <button
              id="cancel-button"
              type="button"
              class="rounded-md bg-gray-500 px-5 py-2 text-sm font-semibold text-white hover:bg-gray-600"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="flex items-center gap-2 rounded-md bg-yellow-500 px-5 py-2 text-sm font-semibold text-white hover:bg-yellow-400"
            >
              Save

              <img
                src="image/save.svg"
                alt="Save"
                class="h-5 w-5"
              />
            </button>
          </div>
        </div>
      </div>
    </form>

    <script>
      const movieForm = document.getElementById("movie-form");
      const overview = document.getElementById("overview");
      const characterCount = document.getElementById("character-count");
      const fileUpload = document.getElementById("file-upload");
      const uploadText = document.getElementById("upload-text");
      const cancelButton = document.getElementById("cancel-button");

      // Menghitung karakter Overview
      overview.addEventListener("input", function () {
        characterCount.textContent = overview.value.length + "/500";
      });

      // Menampilkan nama file gambar
      fileUpload.addEventListener("change", function () {
        const selectedFile = fileUpload.files[0];

        if (!selectedFile) {
          uploadText.textContent = "Drag and drop image here";
          return;
        }

        const maximumFileSize = 5 * 1024 * 1024;

        if (selectedFile.size > maximumFileSize) {
          alert("Ukuran gambar maksimal 5MB.");

          fileUpload.value = "";
          uploadText.textContent = "Drag and drop image here";
          return;
        }

        uploadText.textContent = selectedFile.name;
      });

      // Tombol Cancel kembali ke home.html
      cancelButton.addEventListener("click", function () {
  if (window.parent && window.parent.closePopup) {
    window.parent.closePopup();
  }
});

      // Tombol Save
      movieForm.addEventListener("submit", function (event) {
  event.preventDefault();

  alert("Movie berhasil disimpan!");

  if (window.parent && window.parent.closePopup) {
    window.parent.closePopup();
  }
});
    </script>
  </body>
</html>
