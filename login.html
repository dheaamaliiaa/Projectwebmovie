<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movieflix Login</title>
    <style>
      body {
  margin: 0;
  padding: 0;
}
        .container{
            width: 100%; 
            min-height: 100vh;
            display: flex;
        }
            .left {
  width: 55%;
  height: 100vh;

  color: white;
  background-image: url("image/nontonfilm.png");
  background-size: cover;
  background-position: center;

  position: relative;
    }

          .left h1 {
  position: absolute;
  top: 43%;
  left: 7%;

  margin: 0;
  font-size: 40px;
  font-weight: 400;
}

        .left p {
        position: absolute;
  top: 68%;
  left: 7%;

  margin: 0;
  font-size: 24px;
  line-height: 1.3;
        }

        .right{
  width: 45%;
  height: 100vh;

  background-color: #081C5C;
  color: white;

  position: relative;
        }
    </style>
  </head>
  <body>
    <div class="container">

      <!--left side-->
      <div class="left">
        <h1>Watch Anywhere, Anytime</h1>
        <p>Enjoy thousands of movies,<br>TV shows, and exclusive content.</p>
      </div>

      <!--right side -->
      <div class="right">
        <h1>Movieflix</h1>
        <p>Sign in to your account or create a new one</p><br>

        <!--Input Email & Password-->
        <form action="" method="post">
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email" required placeholder="Enter your email"><br>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" required placeholder="Enter your password"><br>
        </form><br>

        <!--Forgot Password-->
        <a href="#" class="forgot-password" >Forgot Password?</a><br>

        <!--Sign in-->
        <button class="signin-btn">Sign In</button><br>

        <!--Forgot Password-->
        <p>Don't Have an account? <a href="#" class="signup" >Create one now</a> </p>




      </div>
    </div>
  </body>
</html>
