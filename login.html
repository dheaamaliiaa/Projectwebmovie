<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movieflix Login</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .container {
        width: 100%;
        min-height: 100vh;
        display: flex;
      }

      .left {
        width: 55%;
        height: 100vh;
        color: white;
        background-image: url("image/nontonfilm.png");
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .left::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.45);
      }

      .left h1 {
        position: absolute;
        top: 43%;
        left: 7%;
        margin: 0;
        font-size: 40px;
        font-weight: 400;
      }

      .left p {
        position: absolute;
        top: 68%;
        left: 7%;
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }

      .right {
        width: 45%;
        height: 100vh;
        background-color: #081c5c;
        color: white;
        position: relative;
        padding: 10px 30px;
        box-sizing: border-box;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 25px;
      }

      .logo h1 {
        color: #ffc800;
        font-size: 36px;
        margin: 0;
      }

      .play-icon {
        width: 38px;
        height: 38px;
        border: 4px solid #ffc800;
        border-radius: 50%;
        color: #ffc800;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        padding-left: 2px;
        box-sizing: border-box;
      }

      .newone {
        color: white;
        font-size: 30px;
        font-family: sans-serif;
        font-weight: bolder;
      }

      #email,
      #password {
        width: 85%;
        height: 45px;
        background-color: #29417d;
        border: none;
        border-radius: 7px;
        padding: 0 15px;
        box-sizing: border-box;
        color: white;
        font-size: 18px;
        margin: 4px 0;
      }

      #email::placeholder,
      #password::placeholder {
        color: #bfc5d5;
      }

      label {
        color: white;
        font-size: 20px;
        font-weight: bold;
      }

      .forgot-password {
        display: block;
        width: 85%;
        margin: 4px 0 10px;
        text-align: right;
        color: white;
      }

      .signin-btn {
        width: 85%;
        height: 45px;
        background-color: #ffc800;
        border: none;
        border-radius: 7px;
        padding: 0 15px;
        box-sizing: border-box;
        color: #29417d;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: bold;
        cursor: pointer;
      }

      #loginMessage {
        min-height: 20px;
        margin: 10px 0;
      }

      .signup p {
        color: white;
      }

      .signup-link {
        color: #ffc800;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left">
        <h1>Watch Anywhere, Anytime</h1>
        <p>Enjoy thousands of movies,<br />TV shows, and exclusive content.</p>
      </div>

      <div class="right">
        <div class="logo">
          <div class="play-icon">▶</div>
          <h1>MOVIEFLIX</h1>
        </div>

        <div class="newone">
          <p>Sign in to your account</p>
        </div>

        <form id="loginForm">
          <label for="email">Email</label><br />
          <input
            type="email"
            name="email"
            id="email"
            required
            placeholder="Enter your email"
          /><br />

          <label for="password">Password</label><br />
          <input
            type="password"
            name="password"
            id="password"
            required
            placeholder="Enter your password"
          /><br />

          <a href="#" class="forgot-password">Forgot Password?</a>

          <button type="submit" class="signin-btn">Sign In</button>

          <p id="loginMessage"></p>
        </form>
      </div>
    </div>

    <script>
      const akunOwner = {
        email: "owner@movieflix.com",
        password: "owner123",
      };

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginMessage = document.getElementById("loginMessage");

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (
          email === akunOwner.email &&
          password === akunOwner.password
        ) {
          loginMessage.textContent = "Login berhasil!";
          loginMessage.style.color = "lightgreen";
          window.location.href = "home.html";
        } else {
          loginMessage.textContent = "Email atau password salah!";
          loginMessage.style.color = "#ff5c5c";
        }
      });
    </script>
  </body>
</html>
